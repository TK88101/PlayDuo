.lead{color:var(--muted);max-width:64ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

const GENRES = ['FPS','MMO','クラフト','PVP','RPG','パズル','レース','ホラー'];

/* ---------- canvas helpers ---------- */
const W = 1280, H = 720, CW = 600, CH = 800;
const UI = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif';
const TAU = Math.PI * 2;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hx = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const toHex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); };
const al = (h, a) => { const [r, g, b] = hx(h); return `rgba(${r},${g},${b},${a})`; };
function mk(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function lin(x, x0, y0, x1, y1, stops){ const g = x.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rad(x, cx, cy, r0, r1, stops){ const g = x.createRadialGradient(cx, cy, r0, cx, cy, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rr(x, X, Y, w, h, r){ r = Math.max(0, Math.min(r, w / 2, h / 2)); x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function fnt(x, size, weight = 700, fam = UI){ x.font = `${weight} ${size}px ${fam}`; }
function text(x, s, X, Y, o = {}){
  x.save(); fnt(x, o.size || 20, o.weight || 700, o.fam || UI);
  x.fillStyle = o.color || '#fff'; x.textAlign = o.align || 'left'; x.textBaseline = o.base || 'alphabetic';
  if (o.shadow){ x.shadowColor = o.shadow; x.shadowBlur = o.blur || 10; }
  x.fillText(s, X, Y); x.restore();
}
function panel(x, X, Y, w, h, o = {}){
  rr(x, X, Y, w, h, o.r ?? 10); x.fillStyle = o.fill || 'rgba(8,12,18,.62)'; x.fill();
  if (o.stroke !== false){ x.strokeStyle = o.stroke || 'rgba(255,255,255,.22)'; x.lineWidth = o.lw || 2; x.stroke(); }
}
function bar(x, X, Y, w, h, v, color, bg = 'rgba(255,255,255,.16)'){
  rr(x, X, Y, w, h, h / 2); x.fillStyle = bg; x.fill();
  rr(x, X, Y, Math.max(h, w * v), h, h / 2); x.fillStyle = color; x.fill();
}
function poly(x, pts, fill){ x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.fillStyle = fill; x.fill(); }
function circle(x, cx, cy, r, fill){ x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fillStyle = fill; x.fill(); }
function person(x, cx, by, h, color){
  x.fillStyle = color;
  x.beginPath(); x.arc(cx, by - h * .86, h * .12, 0, TAU); x.fill();
  rr(x, cx - h * .17, by - h * .72, h * .34, h * .44, h * .08); x.fill();
  rr(x, cx - h * .15, by - h * .32, h * .12, h * .32, h * .04); x.fill();
  rr(x, cx + h * .03, by - h * .32, h * .12, h * .32, h * .04); x.fill();
}
function cube(x, cx, cy, s, top, left, right){
  poly(x, [[cx, cy], [cx + s, cy + s / 2], [cx, cy + s], [cx - s, cy + s / 2]], top);
  poly(x, [[cx - s, cy + s / 2], [cx, cy + s], [cx, cy + 2 * s], [cx - s, cy + 1.5 * s]], left);
  poly(x, [[cx + s, cy + s / 2], [cx, cy + s], [cx, cy + 2 * s], [cx + s, cy + 1.5 * s]], right);
}
function isoGrid(x, hs, ox, oy, s, colorAt){
  const n = hs.length;
  for (let k = 0; k < 2 * n - 1; k++) for (let i = 0; i < n; i++){
    const j = k - i; if (j < 0 || j >= n) continue;
    for (let z = 0; z < hs[i][j]; z++){
      const c = colorAt(i, j, z, hs[i][j]);
      cube(x, ox + (i - j) * s, oy + (i + j) * s / 2 - z * s, s, c[0], c[1], c[2]);
    }
  }
}
function gear(x, cx, cy, r, teeth, color, rot = 0){
  x.save(); x.translate(cx, cy); x.rotate(rot); x.beginPath();
  const n = teeth * 2;
  for (let i = 0; i < n; i++){ const a0 = i / n * TAU, a1 = (i + 1) / n * TAU; x.arc(0, 0, i % 2 ? r : r * 1.2, a0, a1); }

  x.beginPath(); x.arc(0, 0, r * .36, 0, TAU); x.fillStyle = 'rgba(0,0,0,.35)'; x.fill();
  x.restore();
}
function star(x, cx, cy, R, fill){ x.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? R * .45 : R; x.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } x.closePath(); x.fillStyle = fill; x.fill(); }

  rr(x, X, Y, s, s * .14, s * .03); x.fill();

  poly(x, [[X, Y], [X - s * .32, Y + s * .04], [X - s * .32, Y + s * .2], [X, Y + s * .14]], color);
  x.fillStyle = color;
  x.save(); x.translate(X + s * .4, Y + s * .14); x.rotate(.18); rr(x, 0, 0, s * .1, s * .24, s * .02); x.fill(); x.restore();

  rr(x, cx - w * .28, by - h - w * .12, w * .56, w * .13, w * .05); x.fillStyle = 'rgba(160,200,255,.28)'; x.fill();
  x.save(); x.shadowColor = glow; x.shadowBlur = w * .12;
  rr(x, cx - w * .46, by - h * .72, w * .24, h * .14, 4); x.fillStyle = glow; x.fill();
  rr(x, cx + w * .22, by - h * .72, w * .24, h * .14, 4); x.fill(); x.restore();
  rr(x, cx - w * .14, by - h * .45, w * .28, h * .16, 3); x.fillStyle = '#e8eaee'; x.fill();

function osBadges(x, os, X, Y){
  let cx = X;
  os.forEach(o => { fnt(x, 18, 800); const w = x.measureText(o).width + 22; rr(x, cx, Y - 22, w, 30, 6); x.fillStyle = o === 'Windows' ? '#2463c9' : '#6b55d0'; x.fill(); text(x, o, cx + 11, Y, {size: 18, weight: 800}); cx += w + 8; });
  return cx;
}
function drawCover(g){
  const c = mk(CW, CH), x = c.getContext('2d'), r = rng(g.seed);
  COVER[g.genre](x, g, r);
  x.fillStyle = lin(x, 0, CH * .45, 0, CH, [[0, 'rgba(0,0,0,0)'], [.55, 'rgba(0,0,0,.55)'], [1, 'rgba(0,0,0,.85)']]); x.fillRect(0, CH * .45, CW, CH * .55);
  x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(0, 0, CW, 62);
  text(x, g.dev.toUpperCase(), 28, 40, {size: 16, weight: 800, color: g.pal[3]});
  text(x, g.genre, CW - 28, 40, {size: 16, weight: 800, color: g.pal[2], align: 'right'});
  const fam = `"${g.font}", ${UI}`;
  let size = 104; fnt(x, size, g.fw, fam);
  while (x.measureText(g.title).width > CW - 60 && size > 36){ size -= 4; fnt(x, size, g.fw, fam); }
  text(x, g.title, CW / 2, CH - 150, {size, weight: g.fw, fam, align: 'center', color: g.pal[3], shadow: 'rgba(0,0,0,.8)', blur: 18});
  text(x, g.en, CW / 2, CH - 108, {size: 22, weight: 800, align: 'center', color: g.pal[2]});
  osBadges(x, g.os, 28, CH - 36);
  text(x, '架空タイトル', CW - 28, CH - 36, {size: 14, weight: 700, align: 'right', color: 'rgba(255,255,255,.6)'});
  return c;
}

        ['古い写真', (X, Y) => { x.fillStyle = '#d8d4cc'; x.fillRect(X - 36, Y - 28, 72, 56); x.fillStyle = '#6b6b70'; x.fillRect(X - 30, Y - 22, 60, 40); person(x, X - 10, Y + 18, 34, '#2a2a2e'); person(x, X + 12, Y + 18, 30, '#2a2a2e'); }],
        ['メモ ×3', (X, Y) => { [0, 1, 2].forEach(o => { x.save(); x.translate(X + o * 6 - 6, Y + o * 4 - 4); x.rotate(-.1 + o * .08); x.fillStyle = '#e4dccb'; x.fillRect(-26, -32, 52, 64); x.restore(); }); }],
        ['音楽室の楽譜', (X, Y) => { x.fillStyle = '#e4dccb'; x.fillRect(X - 34, Y - 30, 68, 60); x.strokeStyle = '#333333'; x.lineWidth = 1; for (let i = 0; i < 5; i++){ x.beginPath(); x.moveTo(X - 28, Y - 16 + i * 8); x.lineTo(X + 28, Y - 16 + i * 8); x.stroke(); } circle(x, X - 8, Y + 4, 5, '#333333'); circle(x, X + 12, Y - 4, 5, '#333333'); }],
        null, null];
      items.forEach((it, i) => { const X = 80 + (i % 4) * 190, Y = 150 + Math.floor(i / 4) * 220;
        panel(x, X, Y, 170, 190, {fill: 'rgba(255,255,255,.04)', stroke: i === 2 ? a : 'rgba(255,255,255,.16)', lw: i === 2 ? 4 : 2, r: 6});
        if (it){ it[1](X + 85, Y + 80); text(x, it[0], X + 85, Y + 168, {size: 17, weight: 700, align: 'center', color: l}); } });
      panel(x, 880, 150, 330, 410, {fill: 'rgba(255,255,255,.04)', stroke: 'rgba(255,255,255,.16)', r: 6});
      text(x, '図書室のカギ', 910, 200, {size: 26, weight: 400, fam: '"Hina Mincho", serif', color: a});
      ['日直のミサキが持っていたカギ。', '札に「2F」と書かれているが、', '図書室は1階のはず……。'].forEach((s, i) => text(x, s, 910, 250 + i * 34, {size: 17, weight: 700, color: l}));
      panel(x, 910, 470, 270, 60, {fill: al(a, .3), stroke: a, r: 6}); text(x, '使う', 1045, 510, {size: 22, weight: 800, align: 'center'});
    },
  ],
};
function drawShot(g, i){ const c = mk(W, H), x = c.getContext('2d'); SHOTS[g.genre][i](x, g, rng(g.seed * 7 + i)); return c; }

/* ---------- page ---------- */
const assets = new Map();
const osLabel = g => g.os.join(' / ');
const osKey = g => g.os.length === 2 ? 'both' : (g.os[0] === 'Windows' ? 'win' : 'mac');
const fileNames = g => [`${g.id}_cover.png`, `${g.id}_ss1.png`, `${g.id}_ss2.png`, `${g.id}_ss3.png`];
const state = {os: 'all', genre: 'all'};
const $ = id => document.getElementById(id);
let downloads = null;

function el(tag, attrs = {}, kids = []){
  const n = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => { if (k === 'text') n.textContent = v; else if (k === 'class') n.className = v; else n.setAttribute(k, v); });
  kids.forEach(k => n.append(k)); return n;
}
function renderStats(){
  const c = k => GAMES.filter(g => osKey(g) === k).length;
  [[GAMES.length, 'タイトル'], [c('win'), 'Windows専用'], [c('mac'), 'Mac専用'], [c('both'), '両対応'], [GENRES.length, 'ジャンル'], [GAMES.length * 4, '画像']]
    .forEach(([n, t]) => $('stats').append(el('div', {class: 'stat'}, [el('b', {text: String(n)}), t])));
}
function chip(label, pressed, onClick){ const b = el('button', {class: 'chip', type: 'button', 'aria-pressed': String(pressed), text: label}); b.addEventListener('click', onClick); return b; }
function renderFilters(){
  const osRow = $('osRow'), gRow = $('genreRow');
  osRow.querySelectorAll('.chip').forEach(n => n.remove()); gRow.querySelectorAll('.chip').forEach(n => n.remove());
  [['all', 'すべて'], ['win', 'Windows対応'], ['mac', 'Mac対応'], ['both', '両対応のみ']].forEach(([k, t]) => osRow.append(chip(t, state.os === k, () => { state.os = k; renderFilters(); applyFilter(); })));
  [['all', 'すべて'], ...GENRES.map(g => [g, g])].forEach(([k, t]) => gRow.append(chip(t, state.genre === k, () => { state.genre = k; renderFilters(); applyFilter(); })));
}
function matches(g){
  const ok = state.os === 'all' || (state.os === 'win' && g.os.includes('Windows')) || (state.os === 'mac' && g.os.includes('Mac')) || (state.os === 'both' && g.os.length === 2);
  return ok && (state.genre === 'all' || g.genre === state.genre);
}
function applyFilter(){
  let n = 0; document.querySelectorAll('.game').forEach(card => { const g = GAMES.find(v => v.id === card.dataset.id); const show = matches(g); card.hidden = !show; if (show) n++; });
  $('count').textContent = `${n} 件を表示中（全 ${GAMES.length} 件）`;
}
function renderCards(){
  GAMES.forEach(g => {
    const names = fileNames(g);
    const coverImg = el('img', {alt: `${g.title} のカバー画像`, 'data-file': names[0], width: '600', height: '800'});
    const coverBtn = el('button', {class: 'cover-btn', type: 'button', 'aria-label': `${g.title} のカバーを拡大`}, [coverImg]);
    coverBtn.addEventListener('click', () => openDlg(names[0], `${g.title} のカバー画像`));
    const top = el('div', {class: 'meta-top'}, [el('span', {class: 'pid', text: g.id}), el('span', {class: 'tag', text: g.genre}), ...g.os.map(o => el('span', {class: `os ${o === 'Windows' ? 'win' : 'mac'}`, text: o}))]);
    const meta = el('div', {class: 'meta'}, [
      ['価格', `¥${g.price.toLocaleString('ja-JP')}`], ['容量', `${g.size.toFixed(1)} GB`], ['開発', g.dev], ['発売日', g.release]
    ].map(([k, v]) => el('div', {}, [el('span', {text: k}), el('b', {text: v})])));
    const shots = el('div', {class: 'shots'}, names.slice(1).map((f, i) => {
      const b = el('button', {class: 'shot', type: 'button', 'aria-label': `${g.title} のゲーム画面 ${i + 1} を拡大`}, [el('img', {alt: `${g.title} のゲーム画面 ${i + 1}`, 'data-file': f, width: '1280', height: '720'})]);
      b.addEventListener('click', () => openDlg(f, `${g.title} のゲーム画面 ${i + 1}`)); return b; }));
    const btns = el('div', {class: 'rowbtns dl-only'}, names.map((f, i) => { const b = el('button', {class: 'mini', type: 'button', text: i ? `画面${i}を保存` : 'カバーを保存'}); b.addEventListener('click', () => saveAsset(f)); return b; }));
    const body = el('div', {}, [top, el('h2', {text: g.title}), el('div', {class: 'en', text: g.en}), meta, el('p', {class: 'desc', text: g.desc}), shots, btns, el('div', {class: 'files', text: names.join('  ')})]);
    $('grid').append(el('article', {class: 'game', 'data-id': g.id}, [coverBtn, body]));
  });
}
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }
function openDlg(file, alt){ const a = assets.get(file); if (!a) return; $('dlgImg').src = a.url; $('dlgImg').alt = alt; $('dlgName').textContent = file; $('dlg').dataset.file = file; $('dlg').showModal(); }
$('dlgClose').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
$('dlgSave').addEventListener('click', () => saveAsset($('dlg').dataset.file));

async function save(filename, data){
  if (!downloads){ toast('この表示ではファイル保存が使えません'); return; }
  try { const res = await downloads.save({filename, data}); if (res && res.status === 'saved') toast(`${filename} を保存しました`); }
  catch (e){ const code = e && e.code; if (code === 'declined') return; if (code === 'rate_limited') toast('保存の確認画面がまだ開いています'); else toast(`保存できませんでした（${code || 'error'}）`); }
}
function saveAsset(file){ const a = assets.get(file); if (a) save(file, a.blob); else toast('画像を描画中です。少し待ってからもう一度押してください'); }
function csv(){
  const esc = v => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = ['product_id', 'title', 'title_en', 'genre', 'platform', 'windows', 'mac', 'price_yen', 'size_gb', 'developer', 'release_date', 'description', 'cover_image', 'screenshot1', 'screenshot2', 'screenshot3'];
  const rows = GAMES.map(g => [g.id, g.title, g.en, g.genre, osLabel(g), g.os.includes('Windows') ? 1 : 0, g.os.includes('Mac') ? 1 : 0, g.price, g.size, g.dev, g.release, g.desc, ...fileNames(g)]);
  return '﻿' + [head, ...rows].map(r => r.map(esc).join(',')).join('\r\n') + '\r\n';
}
$('csvBtn').addEventListener('click', () => save('stem_products.csv', csv()));
$('zipBtn').addEventListener('click', async () => {
  if (typeof JSZip === 'undefined'){ toast('ZIPの準備ができませんでした。ページを再読み込みしてください'); return; }
  if (assets.size < GAMES.length * 4){ toast('画像を描画中です。少し待ってからもう一度押してください'); return; }
  const btn = $('zipBtn'); btn.disabled = true; btn.textContent = 'ZIPを作成中…';
  try { const zip = new JSZip(); const f = zip.folder('images'); assets.forEach((a, name) => f.file(name, a.blob)); zip.file('stem_products.csv', csv());
    const blob = await zip.generateAsync({type: 'blob'}); await save('stem_game_assets.zip', blob); }
  catch (e){ toast('ZIPを作成できませんでした'); }
  finally { btn.disabled = false; btn.textContent = '全画像とCSVをZIPで保存'; }
});

async function waitFonts(){
  const link = $('gfonts');
  if (!link.sheet) await Promise.race([new Promise(r => link.addEventListener('load', r, {once: true})), sleep(4000)]);
  const loads = GAMES.map(g => document.fonts.load(`${g.fw} 80px "${g.font}"`, g.title + g.en).catch(() => null));
  loads.push(document.fonts.load('400 26px "Hina Mincho"', '10月30日木日直放課後、図書室のカギを返しに行った。誰もいないはずの2階からピアノの音がした音楽室は先週なくなっている明日先生に言おう持ち物').catch(() => null));
  await Promise.race([Promise.all(loads), sleep(6000)]);
}
const toBlob = c => new Promise(res => c.toBlob(b => res(b), 'image/png'));
async function renderImages(){
  for (const g of GAMES){
    let canvases;
    try { canvases = [drawCover(g), drawShot(g, 0), drawShot(g, 1), drawShot(g, 2)]; }
    catch (e){ console.error('draw failed', g.id, e); continue; }
    const names = fileNames(g);
    for (let i = 0; i < 4; i++){
      const blob = await toBlob(canvases[i]); if (!blob) continue;
      const url = URL.createObjectURL(blob); assets.set(names[i], {blob, url});
      document.querySelectorAll(`img[data-file="${names[i]}"]`).forEach(im => { im.src = url; });
    }
    await sleep(0);
  }
}
async function initDownloads(){
  if (window.claude && typeof window.claude.use === 'function'){ try { downloads = await window.claude.use('downloads'); } catch (e){ downloads = null; } }
  const has = !!downloads;
  $('actions').hidden = !has; $('dlNote').hidden = has;
  document.querySelectorAll('.dl-only').forEach(n => { n.hidden = !has; }); $('dlgSave').hidden = !has;
}

renderStats(); renderFilters(); renderCards(); applyFilter();
initDownloads();
waitFonts().then(renderImages);
</script>
